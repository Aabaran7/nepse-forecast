# Date-indexed market structure and cost constants.
#
# Every entry carries `source`, and the label matters:
#   EMPIRICAL  derived from pulled price data. Describes what the market DID,
#              which is not the same as what the rule SAID.
#   SECONDARY  from news/aggregator reporting (ShareSansar, Kathmandu Post,
#              Investopaper, explainer blogs), cross-checked between at least
#              two of them and, where possible, against EMPIRICAL data.
#              NOT a primary circular. Good enough to build and backtest
#              against; flagged so nobody later mistakes it for verified.
#   PRIMARY    the SEBON/NEPSE/CDSC circular itself. Nothing here is PRIMARY yet.
#   TODO       unresolved. Do not guess, and do not let a backtest run against
#              a TODO cost.
#
# Seeded: Phase 0, 2026-07-25. Costs sourced 2026-08-04 (plan §4).
#
# THE BIG FINDING (2026-08-04): almost every constant here changed inside the
# 2016-2026 sample, and two of them changed in April/July 2026 -- i.e. inside
# the most recent 80 sessions. A scalar cost model would be wrong for most of
# the sample and wrong in a different way for the end of it.

meta:
  seeded: 2026-07-25
  costs_sourced: 2026-08-04
  sample_verified_from: 2025-07-23
  sample_verified_to: 2026-07-24
  primary_verification: TODO   # nothing below is from a circular yet

# --- trading calendar ------------------------------------------------------
# The trading WEEK changed inside our sample. This is not a detail: h=5 ("one
# week ahead") spans a different weekday set either side of the boundary, and
# any day-of-week feature is not comparable across it.
trading_week:
  - effective_from: null          # TODO: when did Sun-Thu begin? predates our sample
    effective_to: 2022-05-19
    days: [Sunday, Monday, Tuesday, Wednesday, Thursday]
    source: EMPIRICAL             # holds across the deep series from 2016-01

  # Found 2026-08-04 by nepselab.quality.weekday_violations over the 2016-2026
  # deep series (plan §3.5) -- NOT visible in the 225-session window this file
  # was seeded from, which is why the two-era version above was wrong.
  # 15 Friday sessions in one contiguous block, Sundays continuing throughout:
  # a six-day trading week, not a shifted five-day one.
  - effective_from: 2022-05-20    # first Friday session observed
    effective_to: 2022-09-16      # last Friday session observed
    days: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday]
    source: EMPIRICAL
    note: >
      95 sessions in ~17 weeks: Mon-Thu 17 each, Fri 15, Sun 12. Bounds are the
      observed first and last Friday, so the true effective dates lie somewhere
      in 2022-05-19..20 and 2022-09-16..18.
      TODO: confirm both dates and the reason against a NEPSE circular.
      MATTERS FOR h=5: "one week ahead" spans six sessions of calendar time
      here, not five, and any day-of-week feature is incomparable across it.

  - effective_from: 2022-09-17
    effective_to: 2026-04-05
    days: [Sunday, Monday, Tuesday, Wednesday, Thursday]
    source: EMPIRICAL             # last Sunday session observed 2026-04-05

  - effective_from: 2026-04-10
    effective_to: null
    days: [Monday, Tuesday, Wednesday, Thursday, Friday]
    source: EMPIRICAL             # first Friday session observed 2026-04-10
    note: >
      Clean switch, no overlap: no Sunday session after 2026-04-05, no Friday
      session before 2026-04-10. 2026-04-06..09 has Mon-Thu sessions.
      TODO: confirm the effective date and the reason against a NEPSE circular;
      also confirm whether trading HOURS changed at the same time.

trading_hours:
  - effective_from: null
    effective_to: 2026-04-17
    open: null                    # TODO: verify per era (NEPSE circulars).
    close: null                   #       Session length has changed historically.
    timezone: Asia/Kathmandu
    source: TODO
  - effective_from: 2026-04-20
    effective_to: null
    open: "11:00"
    close: "15:00"
    timezone: Asia/Kathmandu
    source: SECONDARY
    note: >
      Securities Trading Operations (Fourth Amendment) Bylaws, 2082, announced
      2026-04-18 and effective 2026-04-20. Same amendment widened both circuits
      below. Order placement became round-the-clock; the continuous session is
      11:00-15:00 NPT.

# --- circuit breakers ------------------------------------------------------
# BOTH LIMITS CHANGED ON 2026-04-20. The plan's §3.2 statement that scrip is
# "+-10%" and index "+-6%" describes the sample up to that date and is wrong
# after it. Fill logic must read these by date or it will block fills that
# were legal and allow ones that were not.
scrip_circuit_pct:
  - effective_from: null
    effective_to: 2026-04-17
    limit: 0.10
    source: EMPIRICAL + SECONDARY
    note: >
      Daily scrip returns cluster hard at +-9.99% and stop. Two 2025-07..2026-07
      observations exceed it (NRIC +14.99% 2026-06-01, HDL -14.18% 2025-11-06)
      -- but NOTE the first of those is AFTER the 2026-04-20 widening, so it is
      an ordinary 15%-limit move, not a corporate action. Re-read that way, the
      free corporate-action detector in plan §3.2 must use the date-appropriate
      limit or it manufactures false positives after April 2026.
  - effective_from: 2026-04-20
    effective_to: null
    limit: 0.15
    preopen_limit: 0.05           # widened from 0.02 by the same amendment
    source: EMPIRICAL + SECONDARY
    note: >
      Confirmed independently in our own today_price archive: scrip-days with
      |return| > 10.1% jump from 4 (19 sessions before) to 203 (73 sessions
      after). That is not a drift, it is a rule change.

index_circuit:
  - effective_from: null
    effective_to: 2026-04-17
    daily_cap: 0.06
    observed_overshoot: 0.0007
    halt_schedule:
      - {move: 0.04, halt_minutes: 20}
      - {move: 0.05, halt_minutes: 40}
      - {move: 0.06, halt_minutes: rest_of_day}
    source: EMPIRICAL + SECONDARY
    note: >
      Index daily returns top out at +6.0070% / -6.0002% in the exchange-verified
      window. Re-checked across the full 2016-2026 deep series: max |return|
      6.0610%, ZERO days beyond 6.1%, 12 days in the 6.0-6.1% overshoot band.
      The cap held unchanged for a decade, which also corroborates the deep
      series itself (plan §3.5). Any check must allow tolerance, not test
      equality.
  - effective_from: 2026-04-20
    effective_to: null
    daily_cap: 0.08
    halt_schedule:
      - {move: 0.05, halt_minutes: 15, window: first_two_hours}
      - {move: 0.08, halt_minutes: rest_of_day}
    source: SECONDARY
    note: >
      Two-tier replacement for the old three-tier ladder. NOT yet observable in
      our data -- the 73 post-amendment sessions max out at 3.07%, so nothing
      has come close to either trigger. Recorded from reporting, unverified
      empirically, and it will stay that way until a violent day happens.

# --- costs -----------------------------------------------------------------
# Sourced 2026-08-04 from SECONDARY reporting, cross-checked between outlets.
# The cost model may now run, but every Sharpe it produces must be labelled
# with the fact that these are not circular-verified (plan §6.1).
settlement_cycle:
  - effective_from: null
    effective_to: 2017-12-31       # MUST be bounded: an open-ended first era
    days: 3                        # shadows every later one (era lookup is
    source: TODO                   # first-match, in file order)
    note: >
      T+3 was the earlier regime. One source dates the move to T+2 at Asadh 21,
      2074 BS (~2017-07-05), which if right falls INSIDE the deep sample and
      makes this a genuine two-era constant. Not corroborated by a second
      source, and one outlet garbled the Gregorian conversion, so it stays TODO
      rather than being guessed at.
      IMPACT IF WRONG: one extra day of settlement lag on 2016-2017 exits only.
      Everything from 2018 on is unaffected, so this does not block the backtest.
  - effective_from: 2018-01-01     # conservative: certainly T+2 by then
    effective_to: null
    days: 2
    source: SECONDARY
    note: >
      T+2 is universally reported as current and has been for years. The start
      date is deliberately set later than the claimed 2017 change so the model
      never assumes a FASTER settlement than reality -- erring toward the slower
      cycle is the conservative direction for a long-only strategy, since it
      delays exits rather than accelerating them.

broker_commission:
  - effective_from: null
    effective_to: 2024-05-13
    tiers:                        # NPR turnover band -> rate
      - {up_to: 50000, rate: 0.0040}
      - {up_to: 500000, rate: 0.0037}
      - {up_to: 2000000, rate: 0.0034}
      - {up_to: 10000000, rate: 0.0030}
      - {up_to: null, rate: 0.0027}
    source: SECONDARY
    note: >
      The pre-2024 schedule. Its own START date is unknown -- TODO -- so it is
      applied to everything before 2024-05-14 by default. If an earlier revision
      existed inside 2016-2024 this understates or overstates cost for part of
      the sample; the tiers are ~0.3-0.4% either way, so the error is bounded
      well below the spread between the tiers themselves.
  - effective_from: 2024-05-14     # Jestha 1, 2081 BS
    effective_to: null
    tiers:
      - {up_to: 50000, rate: 0.0036}
      - {up_to: 500000, rate: 0.0033}
      - {up_to: 2000000, rate: 0.0031}
      - {up_to: 10000000, rate: 0.0027}
      - {up_to: null, rate: 0.0024}
    source: SECONDARY
    note: >
      SEBON cut every tier by ~10%. Reported consistently by ShareSansar and
      Investopaper. Since 2025 these are CEILINGS -- a broker may charge less --
      so using them is the conservative (higher-cost) choice.
      Composition, for reference: ~79.4% broker, 20% NEPSE, 0.6% SEBON.

sebon_fee_rate:
  - effective_from: null
    effective_to: null
    rate: 0.00015                 # 0.015% of transaction value
    charged_on: both
    source: SECONDARY
    note: >
      Levied on both buy and sell. No revision found within the sample; if one
      existed it is unrecorded here. TODO: confirm against SEBON directly.

dp_charge_npr:
  - effective_from: null
    effective_to: null
    amount: 25
    unit: per_scrip_per_settlement
    charged_on: TODO              # buy | sell | both -- SOURCES DISAGREE
    source: SECONDARY
    note: >
      Rs 25 flat, per company per settlement. Sources explicitly disagree on
      whether it hits the buy side, the sell side, or both, so this stays TODO
      per plan §4's rule against guessing.
      THIS IS THE ONE THAT MATTERS MOST FOR THIS PROJECT. It does not scale with
      notional, so at a small declared capital base a flat Rs 25-50 per
      round-trip dominates everything else here, and it is precisely what makes
      a daily-rebalancing signal untradeable. The cost model must therefore
      treat charged_on as an ASSUMPTION TO REPORT, and results should be shown
      for both the sell-only and the both-sides reading.

cgt_rate:
  # Levied on REALIZED GAINS, not turnover. Rates rose in the 2083/84 Finance
  # Act -- inside our sample, in the last ~15 sessions of it.
  - effective_from: null
    effective_to: 2026-07-16
    individual_short: 0.075       # held < 365 days
    individual_long: 0.05         # held >= 365 days
    institutional: 0.10
    finance_act_year: "2081/82-2082/83"
    source: SECONDARY
  - effective_from: 2026-07-17     # Shrawan 1, 2083 BS -- start of FY 2083/84
    effective_to: null
    individual_short: 0.10
    individual_long: 0.075
    institutional: 0.10
    finance_act_year: "2083/84"
    source: SECONDARY
    note: >
      Both individual rates rose. The exact Gregorian date of Shrawan 1, 2083 is
      taken as 2026-07-17; it may be off by a day. TODO: confirm.
      Immaterial for a long-only index strategy held <365 days, which pays the
      short rate either way -- but it changes the after-tax figure by 2.5pp of
      realized gain for anything closed after mid-July 2026.
