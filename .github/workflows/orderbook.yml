# Order book snapshots, taken DURING the session.
#
# Separate from daily.yml because it has to run at a completely different time.
# daily.yml runs after the close, which is correct for prices and useless here:
# NEPSE serves an empty book outside market hours, so an after-close capture
# returns nothing. Measured 2026-08-09 (Sunday) and 2026-08-10 01:45 NPT
# (pre-open): both empty.
#
# This is also the only data in the project with no history whatsoever. The
# price archive serves a rolling year, which is bad enough; the book serves NOW.
# A snapshot not taken never existed, so this job's failure mode is worse than
# daily.yml's and its retry posture is more aggressive: five captures a session,
# each independent, any four can fail without losing the day's shape.

name: orderbook

on:
  schedule:
    # NEPSE trades 11:00-15:00 NPT = 05:15-09:15 UTC, Mon-Fri
    # (configs/market_params.yaml, effective 2026-04-20).
    #
    # Every slot is placed with an HOUR of headroom before the close, because
    # GitHub does not run these on time. Measured 2026-08-10: the 09:05 slot
    # executed at 09:59 UTC -- 54 minutes late, by which point the market had
    # shut and the capture was correctly refused. A schedule that only works
    # when Actions is punctual is a schedule that quietly collects nothing on
    # busy days, so the late-session slot is gone rather than nominally present.
    - cron: "20 5 * * 1-5"    # 11:05 NPT, just after the open
    - cron: "00 6 * * 1-5"    # 11:45
    - cron: "45 6 * * 1-5"    # 12:30
    - cron: "30 7 * * 1-5"    # 13:15
    - cron: "15 8 * * 1-5"    # 14:00 -- still lands inside the session an hour late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Queue rather than cancel. Two captures minutes apart are two observations,
  # not a duplicate -- cancelling one loses it permanently.
  group: orderbook
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10.12"
          cache: pip

      - run: pip install -r requirements.txt

      # MUST run before the capture. A runner starts empty, so without this the
      # store is rebuilt from this run's ten rows and archive_backup then
      # overwrites the mirror with the shorter table -- which is exactly how
      # three captures on 2026-08-10 became one. Only the raw payloads survived,
      # because those are copied file by file rather than regenerated.
      - name: Rehydrate the store
        run: python scripts/archive_restore.py --from data-mirror

      - name: Capture the book
        run: python scripts/snapshot_orderbook.py

      - name: Commit
        if: always()
        run: |
          git config user.name  "nepse-bot"
          git config user.email "noreply@github.com"
          python scripts/archive_backup.py --dir data-mirror --no-git
          git add data-mirror
          git diff --cached --quiet || git commit -m "orderbook: $(date -u +%FT%H:%MZ)"
          # Five jobs a day race with daily.yml for the same branch. Rebase and
          # retry rather than failing: a lost push here is a lost snapshot.
          for i in 1 2 3; do
            git pull --rebase -q origin master && git push -q origin master && exit 0
            sleep 5
          done
          echo "push failed after 3 attempts; the snapshot is committed locally "
          echo "on the runner and will be lost. Raw payload is in the run log."
          exit 1
