# Publish the dashboard on its own, without touching the data pipeline.
#
# daily.yml also deploys, at the end of each data run. This exists for the other
# case: a change to the page itself -- a styling fix, a copy correction -- which
# should go live without pulling from NEPSE or rewriting the archive.
#
# public/data/ IS in the trigger list, and the reasoning for leaving it out was
# wrong. It is true that the daily job's own commits cannot fire this -- they
# carry GITHUB_TOKEN and GitHub blocks that to prevent recursion, which is why
# daily.yml deploys for itself. But a HUMAN commit touching that file fires
# normally, and the first one after this workflow was written did exactly that:
# a data repair was pushed and the site kept serving the broken numbers, because
# nothing redeployed. Two trigger sources, both real, only one of them obvious.

name: pages

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/data/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with daily.yml's deploy job: two deploys landing on Pages at once is a
# race, and the loser is whichever finished first. cancel-in-progress is safe
# here in a way it is not for the data job -- a cancelled deploy loses nothing,
# because the next one publishes the same artifact from the same commit.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Publishes whatever public/data/dashboard.json is committed. If the data
      # job has not run yet, that is the last committed snapshot -- and the page
      # shows its own build date and a per-source freshness panel, so a stale
      # deploy announces itself rather than passing for current.
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v5
